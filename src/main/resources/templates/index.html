<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/index.css}">
	<title>Home Page</title>
	<script
      src="https://kit.fontawesome.com/112eea2fba.js"
      crossorigin="anonymous"
    ></script>
</head>
<body>
	<!--Header-->
	<div th:insert="navbar.html :: navbar"></div>
	
	 <!--nice pic-->
	<div class="df container-fluid align-items-center h-100">
        <div class="row justify-content-evenly colmn">
            <div class="col-lg-5 d-flex justify-content-center align-items-center text-center">
                <img th:src="@{/images/exam.svg}" height="400px" width="400px" class="img-fluid" alt="quiz image"/>
            </div>
            <div class="col-lg-5 d-flex justify-content-center align-items-center text-center flex-column">
              <h4>Welcome to<br><span class="badge bg-danger fs-2 fw-bold mt-1">Quiz Application App</span></h4>
                <form class="bg-dark p-4 mt-2 px-5" action="questions" method="POST">
                  <label for="in1" class="text-light">Enter your name:</label><br>
                    <input type="text" name="username" id="in1" class="my-3 fs-5" style="width: 350px;"/><br>
                    <p class="text-danger fs-6" th:if="${warning}" th:text="${warning}"></p>
                    <button class="btn btn-primary" type="submit">Start the Quiz</button>
                </form>
            </div>
        </div>
      </div>
      
      <!--Footer-->
	<div th:insert="footer.html :: footer"></div>
	
	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
